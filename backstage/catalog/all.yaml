# Single catalog entry point registered in the Backstage app config.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: idp-platform
  description: Teams and paved-road templates for idp-platform.
spec:
  targets:
    - ./groups.yaml
    - ./users.yaml
    - ../templates/database/template.yaml
    - ../templates/webservice/template.yaml
    - ../templates/service/template.yaml
    - ../templates/deploy/template.yaml
    # Its own Location, because a glob that matches nothing is a read error
    # and would otherwise drop every target in this file (ADR-0019).
    - ./resources.yaml
