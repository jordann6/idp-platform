    platform.jordandesigns.io/claim: claims/team-ops/web-az-a.webservice.yaml
    platform.jordandesigns.io/cloud: azure
    platform.jordandesigns.io/visibility: public
    platform.jordandesigns.io/requested-by: guest
  tags:
    - webservice
    - azure
spec:
  type: service
  lifecycle: dev
  owner: group:default/team-ops
  system: webservices
