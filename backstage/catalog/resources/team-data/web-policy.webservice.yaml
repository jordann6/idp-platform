# Written by the Backstage WebService template next to the claim it describes.
# A web service is a Component in Backstage terms, not a Resource. The team
# owns it; the requester is recorded separately because guest sign-in means
# every requester is guest for now (ADR-0019).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: team-data-web-policy
  title: web-policy
  description: Web service web-policy for team-data, delivered by the WebService template.
  annotations:
    backstage.io/source-location: url:https://github.com/jordann6/idp-platform/tree/main/claims/team-data/
    platform.jordandesigns.io/claim: claims/team-data/web-policy.webservice.yaml
    platform.jordandesigns.io/cloud: gcp
    platform.jordandesigns.io/visibility: internal
    platform.jordandesigns.io/requested-by: jordann6
  tags:
    - webservice
    - gcp
spec:
  type: service
  lifecycle: dev
  owner: group:default/team-data
  system: webservices
