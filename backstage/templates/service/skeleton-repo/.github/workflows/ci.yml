name: CI

# Written by the idp-platform service template (ADR-0024). Pull requests and
# pushes to main run the platform guardrails. A push to main then publishes a
# linux/amd64 and linux/arm64 image to ECR Public through GitHub OIDC, with no
# stored credential, and writes the digest to the job summary. Deploying it is
# the deploy template in the portal, a reviewed pull request on idp-platform.
#
# Pull requests always run, because the two guardrails checks are required by
# branch protection and a skipped workflow would leave a docs-only pull
# request waiting forever. Pushes to main skip documentation-only changes.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  guardrails:
    # Pinned by full SHA to platform-guardrails v1.4.0; the floating v1 tag
    # is older than v1.4.0.
    uses: jordann6/platform-guardrails/.github/workflows/ci.yml@f3ac73cfd5dcc2d13491b6997c4796b1eb1c8656
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: guardrails-${{ github.ref }}
      cancel-in-progress: true

  publish:
    needs: guardrails
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Never cancelled, so a push to main is never half published.
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.IDP_CI_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      # The ECR Public repository has the same name as this repository and is
      # created on the first publish, tagged with the team the name starts
      # with. The publish role cannot delete it; make ecr-public-clean can.
      - name: Find or create the ECR Public repository
        id: repo
        run: |
          name="$GITHUB_REPOSITORY"
          team="${name#*/}"
          team="${team%%.*}"
          if ! uri=$(aws ecr-public describe-repositories --repository-names "$name" --query 'repositories[0].repositoryUri' --output text 2>/dev/null); then
            uri=$(aws ecr-public create-repository --repository-name "$name" --tags Key=Project,Value=idp-platform "Key=Team,Value=$team" --query 'repository.repositoryUri' --output text)
          fi
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Provenance off, so the index holds exactly the two platform images.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.repo.outputs.uri }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Job summary
        env:
          URI: ${{ steps.repo.outputs.uri }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "Digest for the deploy template: \`$DIGEST\`"
            echo
            echo "Image: \`$URI@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
