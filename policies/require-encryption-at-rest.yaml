# Storage encryption on every database. Cloud SQL and Flexible Server encrypt
# at rest by default with no way to turn it off, so only RDS, where it is a
# flag, needs a rule.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-encryption-at-rest
  annotations:
    policies.kyverno.io/title: Encrypt databases at rest
    platform.jordandesigns.io/control: "SOC2 CC6.7; CIS 3.11 (encrypt data at rest)"
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  # Composed kinds are named by version, never "*": Kyverno's reports
  # controller cannot resolve a wildcard version to a kind, so it never
  # watched these resources and produced no PolicyReport for them, while
  # admission still enforced (found live, ADR-0023). Equivalent keeps a
  # request in a future served version matched through conversion.
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["rds.aws.m.upbound.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["instances"]
  # An update to an object that is already being deleted only removes
  # finalizers (Crossplane, or the garbage collector finishing a foreground
  # deletion that Argo started). Enforcing on it would make a deleted resource
  # undeletable; this was found live when the evidence claim stuck in
  # foregroundDeletion (ADR-0023).
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  validations:
    - expression: "has(object.spec.forProvider.storageEncrypted) && object.spec.forProvider.storageEncrypted == true"
      message: "RDS instances must set storageEncrypted: true."
