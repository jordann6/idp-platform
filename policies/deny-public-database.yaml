# No database is reachable from the internet. The Database API has no public
# option at all; this checks what the Compositions actually compose, so a
# Composition bug cannot open a database. Each cloud spells it differently:
# RDS publiclyAccessible, Cloud SQL a public IPv4 address, Flexible Server
# public network access. Each must be explicitly off.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: deny-public-database
  annotations:
    policies.kyverno.io/title: No publicly reachable database
    platform.jordandesigns.io/control: "SOC2 CC6.6, CC6.1; CIS 5.2 (limit network exposure)"
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  # Composed kinds are named by version, never "*": Kyverno's reports
  # controller cannot resolve a wildcard version to a kind, so it never
  # watched these resources and produced no PolicyReport for them, while
  # admission still enforced (found live, ADR-0023). Equivalent keeps a
  # request in a future served version matched through conversion.
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["rds.aws.m.upbound.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["instances"]
      - apiGroups: ["sql.gcp.m.upbound.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["databaseinstances"]
      - apiGroups: ["dbforpostgresql.azure.m.upbound.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["flexibleservers"]
  # An update to an object that is already being deleted only removes
  # finalizers (Crossplane, or the garbage collector finishing a foreground
  # deletion that Argo started). Enforcing on it would make a deleted resource
  # undeletable; this was found live when the evidence claim stuck in
  # foregroundDeletion (ADR-0023).
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: group
      expression: "object.apiVersion.split('/')[0]"
    - name: fp
      expression: "object.spec.forProvider"
  validations:
    - expression: >-
        variables.group == 'rds.aws.m.upbound.io'
          ? has(variables.fp.publiclyAccessible) && variables.fp.publiclyAccessible == false
          : variables.group == 'sql.gcp.m.upbound.io'
            ? has(variables.fp.settings) && has(variables.fp.settings.ipConfiguration) && has(variables.fp.settings.ipConfiguration.ipv4Enabled) && variables.fp.settings.ipConfiguration.ipv4Enabled == false
            : has(variables.fp.publicNetworkAccessEnabled) && variables.fp.publicNetworkAccessEnabled == false
      message: "Databases must have public access explicitly disabled (RDS publiclyAccessible, Cloud SQL ipv4Enabled, Flexible Server publicNetworkAccessEnabled)."
