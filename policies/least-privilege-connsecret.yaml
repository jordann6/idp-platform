# A database's connection Secret lives in its team's namespace, and nothing in
# that namespace may grant another namespace's identities access to it: a
# RoleBinding in a team namespace may name service accounts of that namespace
# only, and may not hand out cluster-admin.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: least-privilege-connsecret
  annotations:
    policies.kyverno.io/title: Connection secrets stay with their team
    platform.jordandesigns.io/control: "SOC2 CC6.1, CC6.3; CIS 1.x (access management)"
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  # An update to an object that is already being deleted only removes
  # finalizers (Crossplane, or the garbage collector finishing a foreground
  # deletion that Argo started). Enforcing on it would make a deleted resource
  # undeletable; this was found live when the evidence claim stuck in
  # foregroundDeletion (ADR-0023).
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
    - name: team-namespace
      expression: "object.metadata.namespace.startsWith('team-')"
  validations:
    - expression: >-
        !has(object.subjects) || object.subjects.all(s,
          s.kind != 'ServiceAccount' || !('namespace' in s) || s['namespace'] == object.metadata.namespace)
      message: "RoleBindings in a team namespace may only bind service accounts of that namespace."
    - expression: "object.roleRef.name != 'cluster-admin'"
      message: "RoleBindings in a team namespace may not grant cluster-admin."
