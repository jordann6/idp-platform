# Backstage Helm values for the idp-platform control plane. Reached only by
# kubectl port-forward on the Mac, so in-memory SQLite is acceptable
# (ADR-0019). The image is the platform's own build of backstage/app, imported
# into K3s by make backstage-image rather than pulled, so nothing needs a
# registry credential; the tag is the commit it was built from. The GitHub
# token and the OAuth app credentials come from Secrets loaded by
# make backstage-token and make backstage-oauth and are never committed.
backstage:
  image:
    registry: docker.io
    repository: library/idp-backstage
    tag: "__BACKSTAGE_IMAGE_TAG__"
    pullPolicy: Never
  extraEnvVarsSecrets:
    - backstage-github
    - backstage-github-oauth
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  appConfig:
    app:
      baseUrl: http://localhost:7007
    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007
      cors:
        origin: http://localhost:7007
      database:
        client: better-sqlite3
        connection: ":memory:"
    # GitHub is the only sign-in. A GitHub user must match a User entity
    # in backstage/catalog/users.yaml by name, or sign-in is refused; the
    # guest provider is not in the image at all (ADR-0019).
    auth:
      providers:
        github:
          development:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    catalog:
      # A Database's entity file is deleted in the same pull request as its
      # claim, so an entity whose file is gone describes nothing and is
      # removed rather than kept with an orphan annotation (ADR-0019).
      orphanStrategy: delete
      rules:
        - allow: [Location, Group, User, Template, Component, Resource, System, API]
      locations:
        - type: url
          target: https://github.com/jordann6/idp-platform/blob/main/backstage/catalog/all.yaml

service:
  ports:
    backend: 7007
