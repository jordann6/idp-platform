# Backstage Helm values for the idp-platform control plane. Reached only by
# kubectl port-forward on the Mac, so in-memory SQLite is acceptable
# (ADR-0019). The image is the platform's own build of backstage/app, imported
# into K3s by make backstage-image rather than pulled, so nothing needs a
# registry credential; the tag is the commit it was built from. The GitHub
# App credentials and the OAuth app credentials come from Secrets loaded by
# make backstage-github-apps and make backstage-oauth and are never committed.
backstage:
  image:
    registry: docker.io
    repository: library/idp-backstage
    tag: "__BACKSTAGE_IMAGE_TAG__"
    pullPolicy: Never
  extraEnvVarsSecrets:
    - backstage-github-apps
    - backstage-github-oauth
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  appConfig:
    # The chart starts Backstage with only this config (its ConfigMap), not
    # the image's app-config files, so every value the frontend requires is
    # set here; the new frontend system fails to render without app.title.
    app:
      title: idp-platform
      baseUrl: http://localhost:7007
      # Plugin discovery for the new frontend system: without it only the
      # features listed in App.tsx load, so there is no landing page and the
      # sidebar fails on plugins it expects. The catalog is the landing page.
      packages: all
      extensions:
        - page:catalog:
            config:
              path: /
    organization:
      name: idp-platform
    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007
      cors:
        origin: http://localhost:7007
      # Reached only over a plain-HTTP localhost port-forward (ADR-0019).
      # Helmet's default upgrade-insecure-requests makes Safari fetch every
      # script from https://localhost:7007, where nothing listens, so the
      # page renders blank; Chrome exempts localhost. Off for that reason.
      csp:
        upgrade-insecure-requests: false
      database:
        client: better-sqlite3
        connection: ":memory:"
    # GitHub is the only sign-in. A GitHub user must match a User entity
    # in backstage/catalog/users.yaml by name, or sign-in is refused; the
    # guest provider is not in the image at all (ADR-0019).
    auth:
      providers:
        github:
          development:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
    # Two GitHub Apps, no token (ADR-0024). Backstage picks the App whose
    # installation owns the repository: gitops for jordann6/idp-platform
    # (claim pull requests, catalog, template skeletons), scaffolder for
    # repositories it creates in idp-platform-apps. A token here would be a
    # silent fallback when no App matches, so there is none.
    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_GITOPS_ID}
              clientId: ${GITHUB_APP_GITOPS_CLIENT_ID}
              clientSecret: ${GITHUB_APP_GITOPS_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_GITOPS_PRIVATE_KEY}
              allowedInstallationOwners:
                - jordann6
            - appId: ${GITHUB_APP_SCAFFOLDER_ID}
              clientId: ${GITHUB_APP_SCAFFOLDER_CLIENT_ID}
              clientSecret: ${GITHUB_APP_SCAFFOLDER_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_SCAFFOLDER_PRIVATE_KEY}
              allowedInstallationOwners:
                - idp-platform-apps
    catalog:
      # A Database's entity file is deleted in the same pull request as its
      # claim, so an entity whose file is gone describes nothing and is
      # removed rather than kept with an orphan annotation (ADR-0019).
      orphanStrategy: delete
      rules:
        - allow: [Location, Group, User, Template, Component, Resource, System, API]
      locations:
        - type: url
          target: https://github.com/jordann6/idp-platform/blob/main/backstage/catalog/all.yaml

service:
  ports:
    backend: 7007
