# Kyverno Helm values for the idp-platform control plane (Phase 5). Slim for
# the 4 GiB VM (ADR-0010): the admission controller enforces the policies in
# policies/, and the reports controller writes the PolicyReports that are the
# compliance evidence. The background controller (generate and mutate-existing
# rules) and the cleanup controller are not used by any policy here, so they
# are off. One replica each: this is a single-node control plane.
admissionController:
  replicas: 1

reportsController:
  enabled: true
  replicas: 1
  # Kyverno cannot grant itself read access to custom kinds, so a policy on
  # them is enforced at admission but not ready for reporting until the
  # reports controller can get, list, and watch them (ADR-0023): the claims
  # and every composed resource kind a policy checks.
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: ["platform.jordandesigns.io"]
          resources: ["databases", "webservices"]
        - apiGroups: ["rds.aws.m.upbound.io"]
          resources: ["instances"]
        - apiGroups: ["ecs.aws.m.upbound.io"]
          resources: ["services", "taskdefinitions"]
        - apiGroups: ["elbv2.aws.m.upbound.io"]
          resources: ["lbtargetgroups", "lblistenerrules"]
        - apiGroups: ["sql.gcp.m.upbound.io"]
          resources: ["databaseinstances"]
        - apiGroups: ["cloudrun.gcp.m.upbound.io"]
          resources: ["v2services"]
        - apiGroups: ["dbforpostgresql.azure.m.upbound.io"]
          resources: ["flexibleservers"]
        - apiGroups: ["containerapp.azure.m.upbound.io"]
          resources: ["containerapps"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["rolebindings"]

backgroundController:
  enabled: false

cleanupController:
  enabled: false
