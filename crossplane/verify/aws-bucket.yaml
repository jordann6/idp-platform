# Phase 0 verification: a trivial managed resource that must reach Ready before
# any real AWS resource is created. Deterministic external name (ADR-0010),
# filled in at apply time from crossplane-auth output verify_bucket_name by
# make aws-verify, so no account ID is committed.
apiVersion: v1
kind: Namespace
metadata:
  name: idp-verify
---
apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Bucket
metadata:
  name: verify
  namespace: idp-verify
  annotations:
    crossplane.io/external-name: __VERIFY_BUCKET_NAME__
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: aws
  forProvider:
    region: us-east-1
    forceDestroy: true
    tags:
      Project: idp-platform
      Environment: verify
      Owner: jordan
      ManagedBy: crossplane
      CostCenter: cc-1001
