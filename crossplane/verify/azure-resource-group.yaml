# Phase 0 verification for Azure. Deterministic external name (ADR-0010).
apiVersion: v1
kind: Namespace
metadata:
  name: idp-verify
---
apiVersion: azure.m.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  name: verify
  namespace: idp-verify
  annotations:
    crossplane.io/external-name: rg-idp-platform-verify
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: azure
  forProvider:
    location: eastus
    tags:
      Project: idp-platform
      Environment: verify
      Owner: jordan
      ManagedBy: crossplane
      CostCenter: cc-1001
