# xdatabase: the cloud-agnostic Database API (ADR-0009, ADR-0003, ADR-0012).
# A developer asks for a size, a platform region, and a Postgres major version.
# Cloud SKUs, cloud region strings, and network primitives never appear here;
# each Composition maps these fields to its own cloud. The cloud itself is
# chosen by the compositionSelector label, not by a field in this schema.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databases.platform.jordandesigns.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Deleting the XRD deletes every Database and its cloud resources, so Argo
    # never deletes it, even when its Application is deleted with cascade.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  group: platform.jordandesigns.io
  scope: Namespaced
  names:
    kind: Database
    plural: databases
    categories:
      - platform
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - name: SIZE
          type: string
          jsonPath: .spec.size
        - name: REGION
          type: string
          jsonPath: .spec.region
        - name: ENDPOINT
          type: string
          jsonPath: .status.endpoint
      schema:
        openAPIV3Schema:
          type: object
          # The name becomes part of cloud identifiers (ADR-0015), so it is held
          # to the strictest cloud rule: lowercase, starts with a letter, no
          # dots, no double hyphens, at most 30 characters.
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z]([a-z0-9-]{0,28}[a-z0-9])?$') && !self.metadata.name.contains('--')"
              message: name must be 1 to 30 lowercase letters, digits, or single hyphens, starting with a letter.
          properties:
            spec:
              type: object
              required:
                - owner
                - costCenter
              properties:
                size:
                  description: T-shirt size. Each Composition maps it to its cloud's instance class and storage.
                  type: string
                  enum: [small, medium, large]
                  default: small
                region:
                  description: Platform region, translated to a cloud region by the platform-regions EnvironmentConfig. Fixed at creation.
                  type: string
                  enum: [us-east]
                  default: us-east
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: region is immutable; create a new Database to move regions.
                engineVersion:
                  description: Postgres major version. Fixed at creation until major upgrades are paved.
                  type: string
                  enum: ["17"]
                  default: "17"
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: engineVersion is immutable until major version upgrades are supported.
                environment:
                  description: Lifecycle stage, carried to cloud tags.
                  type: string
                  enum: [dev, staging, prod]
                  default: dev
                owner:
                  description: Accountable person or group, carried to cloud tags.
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: "^[a-z0-9][a-z0-9-]*$"
                costCenter:
                  description: Chargeback code, carried to the CostCenter cloud tag.
                  type: string
                  pattern: "^cc-[0-9]{4}$"
            status:
              type: object
              properties:
                endpoint:
                  description: Hostname clients connect to, whichever cloud produced it.
                  type: string
                port:
                  description: Port clients connect to.
                  type: integer
                connectionSecret:
                  description: Name of the Secret in this namespace holding host, port, username, password, and dbname.
                  type: string
