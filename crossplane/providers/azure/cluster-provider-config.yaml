# ADR-0001: Entra workload identity federation with the projected K3s token.
# IDs come from bootstrap/azure/crossplane-auth outputs; none are secrets.
apiVersion: azure.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: azure
spec:
  clientID: 00000000-0000-0000-0000-000000000000
  tenantID: 00000000-0000-0000-0000-000000000000
  subscriptionID: 00000000-0000-0000-0000-000000000000
  oidcTokenFilePath: /var/run/secrets/idp-platform/azure/token
  credentials:
    source: OIDCTokenFile
