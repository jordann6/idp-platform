# Activate only the Azure managed resource types the current phase uses.
# Phase 4: Container Apps for xwebservice-azure. The Environment type stays
# inactive because the shared environment is Terraform's (bootstrap/azure/apps),
# never composed. The Flexible Server types (Phase 3) come back with their
# sub-provider. ResourceGroup stays for the Phase 0 verification.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: azure
spec:
  activate:
    - resourcegroups.azure.m.upbound.io
    - containerapps.containerapp.azure.m.upbound.io
