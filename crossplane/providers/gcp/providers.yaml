# crossplane-contrib builds of provider-upjet-gcp (ADR-0013). v3 tracks the
# Terraform Google provider v7; a fresh install needs no storage migration.
# Only the sub-providers a phase uses are installed (ADR-0010 memory budget).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-gcp
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-family-gcp:v3.0.0
  skipDependencyResolution: true
  runtimeConfigRef:
    name: provider-family-gcp
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-storage
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-storage:v3.0.0
  skipDependencyResolution: true
  runtimeConfigRef:
    name: provider-gcp-storage
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-sql
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-gcp-sql:v3.0.0
  skipDependencyResolution: true
  runtimeConfigRef:
    name: provider-gcp-sql
