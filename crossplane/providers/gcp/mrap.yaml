# Activate only the GCP managed resource types the current phase uses.
# Phase 4 (xwebservice-gcp): Cloud Run v2 services. Buckets (Phase 0) and the
# Cloud SQL types (Phase 2) come back when their sub-providers are reinstalled.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: gcp
spec:
  activate:
    - v2services.cloudrun.gcp.m.upbound.io
