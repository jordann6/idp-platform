# ADR-0001: AssumeRoleWithWebIdentity with the projected K3s token. The role
# ARN is filled in at apply time from bootstrap/aws/crossplane-auth (output
# provider_role_arn) by make aws-provider, so no account ID is committed.
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: aws
spec:
  credentials:
    source: WebIdentity
    webIdentity:
      roleARN: __PROVIDER_ROLE_ARN__
      roleSessionName: idp-crossplane
      tokenConfig:
        source: Filesystem
        fs:
          path: /var/run/secrets/idp-platform/aws/token
