# ADR-0001: AssumeRoleWithWebIdentity with the projected K3s token. The role
# comes from bootstrap/aws/crossplane-auth (output provider_role_arn).
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: aws
spec:
  credentials:
    source: WebIdentity
    webIdentity:
      roleARN: arn:aws:iam::ACCOUNT_ID:role/idp-crossplane-provider-aws
      roleSessionName: idp-crossplane
      tokenConfig:
        source: Filesystem
        fs:
          path: /var/run/secrets/idp-platform/aws/token
