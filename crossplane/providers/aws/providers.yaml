# crossplane-contrib builds of provider-upjet-aws (ADR-0013). The family
# provider owns the ProviderConfig types; each sub-provider is its own pod.
# Installed per phase for memory (ADR-0010). Phase 4 needs ecs and elbv2;
# provider-aws-s3 (Phase 0) and provider-aws-rds (Phase 1) are left out and
# reinstalled from git history when a phase needs them. Must match
# AWS_SUBPROVIDERS in bootstrap/k3s/Makefile.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-aws
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-family-aws:v2.8.1
  skipDependencyResolution: true
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-ecs
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-ecs:v2.8.1
  skipDependencyResolution: true
  runtimeConfigRef:
    name: provider-aws-ecs
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-elbv2
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-elbv2:v2.8.1
  skipDependencyResolution: true
  runtimeConfigRef:
    name: provider-aws-elbv2
