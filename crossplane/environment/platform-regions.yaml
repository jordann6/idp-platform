# ADR-0003: the platform region map, kept in this one file. One
# EnvironmentConfig per platform region, labeled with that region, so a
# Composition selects the entry by the XR's spec.region and reads fixed paths
# (aws.region, aws.dbSubnetGroupName). Each entry carries the cloud region and
# the shared network attachment from bootstrap (ADR-0008, ADR-0014). Nothing in
# this file appears in the XRD. AWS values are outputs of bootstrap/aws/network.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: platform-region-us-east
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform.jordandesigns.io/region: us-east
data:
  aws:
    region: us-east-1
    dbSubnetGroupName: idp-platform-us-east
    postgresSecurityGroupId: sg-0643f6eadb6f30e4c
    # Web services (ADR-0022). Values that outlive a demo session only: the
    # private subnets from bootstrap/aws/network and the fixed names from
    # bootstrap/aws/ingress. The listener ARNs, execution role, and task
    # security group are per session and account specific, so they come from
    # the bootstrap-only platform-aws-ingress EnvironmentConfig.
    vpcId: vpc-0dc3bda580ea7530a
    privateSubnetIds:
      - subnet-0dca0cd9e17aad742
      - subnet-022d0ee77a043dc78
    webClusterName: idp-platform-us-east
    webLogGroup: /idp-platform/webservices/us-east
    webAppsDomain: apps.jordandesigns.io
    webInternalDomain: internal.apps.jordandesigns.io
  # Outputs of bootstrap/azure/network. eastus is restricted for Postgres
  # Flexible Server on this subscription, so us-east maps to eastus2 (ADR-0003).
  # Names only: the subscription ID lives in the platform-azure-subscription
  # EnvironmentConfig that make azure-provider applies from Terraform outputs.
  azure:
    region: eastus2
    dataResourceGroup: rg-idp-platform-us-east-data
    networkResourceGroup: rg-idp-platform-us-east-network
    vnetName: vnet-idp-platform-us-east
    postgresSubnetName: snet-postgres
    privateDnsZoneName: privatelink.postgres.database.azure.com
    # Web services (ADR-0022): the standing apps group from
    # bootstrap/azure/network. The environment, cache registry, and runtime
    # identity IDs embed the subscription and come from the bootstrap-only
    # platform-azure-apps EnvironmentConfig.
    appsResourceGroup: rg-idp-platform-us-east-apps
  # Outputs of bootstrap/gcp/network. The project ID is not here: it lives in
  # the platform-gcp-project EnvironmentConfig that make gcp-adc applies from
  # Terraform outputs, so this synced file carries no GCP account identifier.
  gcp:
    region: us-east1
    networkName: idp-platform-us-east
    allocatedIpRange: idp-platform-us-east-psa
    # Web services (ADR-0022), outputs of bootstrap/gcp/web. Names only; the
    # Composition adds the project from platform-gcp-project.
    webCacheRepository: ecr-public
    webRuntimeServiceAccountId: idp-webservice-runtime
