# Root of the app-of-apps. Every Application under argocd/apps is delivered
# from main. Applied by make argocd-root, not synced, so a commit cannot
# repoint the root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: git@github.com:jordann6/idp-platform.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
