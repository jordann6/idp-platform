# Root of the app-of-apps. Every Application under argocd/apps is delivered
# from git. targetRevision follows the Phase 1 branch until PR 1 merges, then
# moves to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: git@github.com:jordann6/idp-platform.git
    targetRevision: phase1-aws
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
